name: CI

# Pushes to `main` and to `claude/**` working branches run directly; pull requests run only
# when they target `main`. A PR from a `claude/**` branch of this repository is skipped by the
# job-level `if` below because its push already ran (no double runs); PRs from forks or from
# other branches still run on the pull_request event.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    # Conventional Commits with `header-max-length` 72 and the CONTRIBUTING scopes (`commitlint.config.mjs`, review R8
    # N6-03a). Only the commits of this push / PR are checked – the round-4…7 subjects in the history predate the rule.
    # No git hook is installed; this job is the gate.
    name: Commit messages (commitlint)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint PR commits (base…head)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint pushed commits (before…sha)
        # A branch creation or force-push reports `before` as all zeros – then only the head commit is checked.
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            npx commitlint --from HEAD~1 --to HEAD --verbose
          else
            npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
          fi

  build-test:
    name: Build & test (Node ${{ matrix.node }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Node 22 (LTS, `.nvmrc`) and 24 (LTS). Node 20 reached end-of-life in April 2026 and cannot run the web
      # tests any more: jsdom 30 requires Node ^22.22.2 || ^24.15.0, vitest 5 ^22.12 || ^24 (review R7, N7-01);
      # `engine-strict=true` in `.npmrc` makes `pnpm install` fail early with an engines error on an older Node.
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6 # version from package.json#packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generated version.ts is committed (no drift against package.json)
        run: |
          pnpm --filter @deriva/pricing-core run version:gen
          git diff --exit-code -- packages/pricing-core/src/version.ts
      - name: Build pricing core (consumed by api/web)
        run: pnpm --filter @deriva/pricing-core run build
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Lint (ESLint, zero warnings)
        run: pnpm -r run lint
      - name: Format check (Prettier)
        run: pnpm format:check
      - name: Unit & integration tests with coverage (core, api, web)
        run: pnpm -r run test -- --coverage
      - name: Dependency audit (production, high+; one retry for registry timeouts)
        run: pnpm audit --prod --audit-level=high || (sleep 30 && pnpm audit --prod --audit-level=high)
      - name: Build API
        run: pnpm --filter @deriva/api run build
      - name: Build Web
        run: pnpm --filter @deriva/web run build
      - name: Install Playwright Chromium
        if: matrix.node == 22
        run: pnpm --filter @deriva/web exec playwright install --with-deps chromium
      - name: E2E smoke (Playwright against production build)
        if: matrix.node == 22
        run: pnpm --filter @deriva/web run test:e2e
      - name: Upload coverage (all packages)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node${{ matrix.node }}
          path: |
            packages/pricing-core/coverage
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: warn
      - name: Upload web build (without source maps) and E2E screenshots
        uses: actions/upload-artifact@v4
        if: always() && matrix.node == 22
        with:
          name: web-dist
          path: |
            apps/web/dist
            !apps/web/dist/**/*.map
            apps/web/e2e-screenshots
          if-no-files-found: warn
