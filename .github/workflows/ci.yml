name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deriva/pricing-core run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - run: pnpm --filter @deriva/api run build
      - run: pnpm --filter @deriva/web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
