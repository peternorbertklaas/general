# Dependabot – weekly dependency and GitHub-Actions updates, grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      fastify:
        patterns: ["fastify", "@fastify/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns:
          [
            "typescript",
            "typescript-eslint",
            "eslint",
            "@eslint/*",
            "prettier",
            "vitest",
            "@vitest/*",
            "vite",
            "@vitejs/*",
            "tsx",
            "playwright",
            "jsdom",
            "globals",
          ]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
